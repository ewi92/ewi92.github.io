<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Emily Williams Photography</title>
    <meta name="description" content="Emily Williams Photography portfolio" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background: #000;
      }

      .banner {
        background: #000;
        color: #fff;
        text-align: center;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        padding: 1.2rem 1rem;
        border-bottom: 1px solid #1c1c1c;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0;
      }

      .tile {
        position: relative;
        aspect-ratio: 1 / 1;
        overflow: hidden;
        display: block;
      }

      .tile img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .overlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: clamp(0.9rem, 1.2vw, 1.15rem);
        padding: 0.8rem;
        opacity: 0;
        transition: opacity 0.2s ease;
      }

      .tile:hover .overlay,
      .tile:focus-visible .overlay {
        opacity: 1;
      }

      @media (max-width: 720px) {
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
