<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MechSoc vs TronSoc 2026 Football Match</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background: #000;
        color: #fff;
      }

      .banner {
        background: #000;
        color: #fff;
        text-align: center;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        padding: 1.2rem 1rem;
        border-bottom: 1px solid #1c1c1c;
      }

      .title {
        text-align: center;
        padding: 2rem 1rem 0.5rem;
        font-size: clamp(1.2rem, 3vw, 2rem);
      }

      .back {
        display: block;
        text-align: center;
        color: #d8d8d8;
        text-decoration: none;
        margin-bottom: 1.5rem;
      }

      .back:hover {
        color: #fff;
      }

      .scatter {
        width: min(1200px, 96vw);
        margin: 0 auto 3rem;
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 1rem;
      }

      .shot {
        width: 100%;
        display: block;
        object-fit: cover;
        border-radius: 4px;
      }

      .one {
        grid-column: 1 / 8;
        transform: rotate(-2deg);
      }

      .two {
        grid-column: 6 / 13;
        margin-top: 3.5rem;
        transform: rotate(1.6deg);
      }

      .three {
        grid-column: 2 / 11;
        margin-top: -0.8rem;
        transform: rotate(-1deg);
      }

      @media (max-width: 900px) {
        .scatter {
          grid-template-columns: 1fr;
          gap: 1.2rem;
          width: min(780px, 94vw);
        }

        .one,
        .two,
        .three {
          grid-column: auto;
          margin-top: 0;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="banner">EMILY WILLIAMS PHOTOGRAPHY</header>
    <h1 class="title">MechSoc vs TronSoc 2026 Football Match</h1>
    <a class="back" href="/">← Back to all shoots</a>

    <main class="scatter">
      <img
        class="shot one"
        src="https://github.com/user-attachments/assets/d41308aa-247d-4434-868e-5d95a39eee73"
        alt="Football match photo one"
      />
      <img
        class="shot two"
        src="https://github.com/user-attachments/assets/e5cea880-3933-4087-a233-b62fd7e666fb"
        alt="Football match photo two"
      />
      <img
        class="shot three"
        src="https://github.com/user-attachments/assets/c817d06b-8d6d-4595-95e2-042fb7bcdf69"
        alt="Football match photo three"
      />
    </main>
  </body>
</html>
